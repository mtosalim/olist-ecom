version: 2

models:
  - name: int_geolocation__aggregated
    description: >
      Consolida os dados de geolocalização da Olist no grão de uma linha
      por prefixo de CEP. Para cada prefixo, seleciona a combinação de
      cidade e estado mais frequente e calcula a mediana das coordenadas
      de latitude e longitude.

    columns:
      - name: geolocation_zip_code_prefix
        description: >
          Prefixo de CEP que identifica unicamente cada registro do modelo.
        data_tests:
          - not_null
          - unique

      - name: geolocation_city
        description: >
          Cidade pertencente à combinação de cidade e estado mais frequente
          encontrada para o prefixo de CEP.
        data_tests:
          - not_null

      - name: geolocation_state
        description: >
          Unidade federativa pertencente à combinação de cidade e estado
          mais frequente encontrada para o prefixo de CEP.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - AC
                  - AL
                  - AP
                  - AM
                  - BA
                  - CE
                  - DF
                  - ES
                  - GO
                  - MA
                  - MT
                  - MS
                  - MG
                  - PA
                  - PB
                  - PR
                  - PE
                  - PI
                  - RJ
                  - RN
                  - RS
                  - RO
                  - RR
                  - SC
                  - SP
                  - SE
                  - TO

      - name: geolocation_lat
        description: >
          Mediana das latitudes disponíveis para o prefixo de CEP.
        data_tests:
          - not_null

      - name: geolocation_lng
        description: >
          Mediana das longitudes disponíveis para o prefixo de CEP.
        data_tests:
          - not_null

      - name: city_state_frequency
        description: >
          Quantidade de registros da staging que apresentam a combinação
          vencedora de cidade e estado para o prefixo de CEP.
        data_tests:
          - not_null
  
  - name: int_order_items__aggregated
    description: >
      Agrega os itens de pedido no grão de uma linha por pedido, consolidando
      quantidades de itens, produtos e vendedores, além dos valores de produtos,
      frete e valor total.

    columns:
      - name: order_id
        description: Identificador único do pedido.
        data_tests:
          - not_null
          - unique

      - name: order_item_count
        description: Quantidade de itens registrados no pedido.
        data_tests:
          - not_null

      - name: distinct_product_count
        description: Quantidade de produtos distintos presentes no pedido.
        data_tests:
          - not_null

      - name: distinct_seller_count
        description: Quantidade de vendedores distintos presentes no pedido.
        data_tests:
          - not_null

      - name: total_product_value
        description: Soma dos preços de todos os itens do pedido.
        data_tests:
          - not_null

      - name: total_freight_value
        description: Soma dos valores de frete de todos os itens do pedido.
        data_tests:
          - not_null

      - name: total_order_item_value
        description: Soma do valor dos produtos e do frete do pedido.
        data_tests:
          - not_null

  - name: int_order_payments__aggregated
    description: >
      Agrega os registros de pagamento no grão de uma linha por pedido.
      Consolida a quantidade de registros e tipos de pagamento, o valor total
      pago, o maior número válido de parcelas e o tipo responsável pelo maior
      valor pago no pedido.

    columns:
      - name: order_id
        description: Identificador único do pedido.
        data_tests:
          - not_null
          - unique

      - name: payment_count
        description: Quantidade de registros de pagamento associados ao pedido.
        data_tests:
          - not_null

      - name: distinct_payment_type_count
        description: Quantidade de tipos distintos de pagamento utilizados no pedido.
        data_tests:
          - not_null

      - name: primary_payment_type
        description: Tipo de pagamento responsável pelo maior valor pago no pedido.
        data_tests:
          - not_null

      - name: total_payment_value
        description: Valor total pago considerando todos os registros de pagamento do pedido.
        data_tests:
          - not_null

      - name: max_installments
        description: >
          Maior número válido de parcelas identificado no pedido. Pode ser nulo
          quando todos os registros possuem uma quantidade de parcelas inválida.
  
  - name: int_customers__enriched
    description: >
      Enriquece os dados dos clientes com coordenadas geográficas obtidas
      pelo prefixo de CEP. Mantém o grão de uma linha por customer_id e
      preserva clientes sem correspondência na base de geolocalização.

    columns:
      - name: customer_id
        description: >
          Identificador único do cliente associado a um pedido.
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: >
          Identificador que representa o mesmo cliente ao longo de diferentes
          pedidos. Pode aparecer em mais de uma linha.
        data_tests:
          - not_null

      - name: customer_zip_code_prefix
        description: Prefixo do CEP informado pelo cliente.
        data_tests:
          - not_null

      - name: customer_city
        description: Cidade informada no cadastro do cliente.
        data_tests:
          - not_null

      - name: customer_state
        description: Unidade federativa informada no cadastro do cliente.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - AC
                  - AL
                  - AP
                  - AM
                  - BA
                  - CE
                  - DF
                  - ES
                  - GO
                  - MA
                  - MT
                  - MS
                  - MG
                  - PA
                  - PB
                  - PR
                  - PE
                  - PI
                  - RJ
                  - RN
                  - RS
                  - RO
                  - RR
                  - SC
                  - SP
                  - SE
                  - TO

      - name: geolocation_lat
        description: >
          Latitude mediana associada ao prefixo de CEP. Pode ser nula quando
          o CEP não possui correspondência na base de geolocalização.

      - name: geolocation_lng
        description: >
          Longitude mediana associada ao prefixo de CEP. Pode ser nula quando
          o CEP não possui correspondência na base de geolocalização.
  
  - name: int_sellers__enriched
    description: >
      Enriquece os dados dos vendedores com coordenadas geográficas obtidas
      pelo prefixo de CEP. Mantém o grão de uma linha por seller_id e preserva
      vendedores sem correspondência na base de geolocalização.

    columns:
      - name: seller_id
        description: Identificador único do vendedor.
        data_tests:
          - not_null
          - unique

      - name: seller_zip_code_prefix
        description: Prefixo do CEP informado pelo vendedor.
        data_tests:
          - not_null

      - name: seller_city_normalized
        description: >
          Cidade do vendedor com normalização de acentos, capitalização
          e espaços aplicada na camada Staging.
        data_tests:
          - not_null

      - name: seller_state
        description: Unidade federativa informada no cadastro do vendedor.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - AC
                  - AL
                  - AP
                  - AM
                  - BA
                  - CE
                  - DF
                  - ES
                  - GO
                  - MA
                  - MT
                  - MS
                  - MG
                  - PA
                  - PB
                  - PR
                  - PE
                  - PI
                  - RJ
                  - RN
                  - RS
                  - RO
                  - RR
                  - SC
                  - SP
                  - SE
                  - TO

      - name: geolocation_lat
        description: >
          Latitude mediana associada ao prefixo de CEP. Pode ser nula quando
          o CEP não possui correspondência na base de geolocalização.

      - name: geolocation_lng
        description: >
          Longitude mediana associada ao prefixo de CEP. Pode ser nula quando
          o CEP não possui correspondência na base de geolocalização.
  
  - name: int_order_reviews__deduplicated
    description: >
      Modelo intermediário com uma linha por pedido. Quando um pedido possui
      mais de uma avaliação, preserva a avaliação respondida mais recentemente,
      com base em review_answer_timestamp. Em caso de empate no timestamp,
      utiliza review_id em ordem decrescente como critério de desempate
      determinístico.

    columns:
      - name: order_id
        description: >
          Identificador do pedido e chave que define o grão do modelo.
          Cada pedido aparece somente uma vez após a deduplicação.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: review_id
        description: >
          Identificador da avaliação preservada para o pedido. Não representa
          uma chave única global, pois um mesmo review_id pode estar associado
          a pedidos diferentes na fonte.
        data_tests:
          - not_null

      - name: review_score
        description: >
          Nota atribuída pelo cliente ao pedido, variando de 1 a 5.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

      - name: review_comment_title
        description: >
          Título opcional escrito pelo cliente na avaliação. Permanece nulo
          quando nenhum título foi informado.

      - name: review_comment_message
        description: >
          Texto opcional escrito pelo cliente na avaliação. Permanece nulo
          quando nenhum comentário foi informado.

      - name: review_creation_date
        description: >
          Data em que a solicitação de avaliação do pedido foi criada.
        data_tests:
          - not_null

      - name: review_answer_timestamp
        description: >
          Data e horário em que a avaliação foi respondida. É o principal
          critério utilizado para selecionar a avaliação mais recente de
          cada pedido.
        data_tests:
          - not_null

  - name: int_order_items__enriched
    description: >
      Modelo intermediário enriquecido no grão de item do pedido, definido pela
      combinação de order_id e order_item_id. Preserva todos os itens provenientes
      de stg_order_items e adiciona atributos do produto e do vendedor por meio
      de left joins. Também calcula o valor total de cada item, somando o preço
      do produto ao valor do frete.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id

      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_item_total_value = price + freight_value"

    columns:
      - name: order_id
        description: >
          Identificador do pedido ao qual o item pertence. Em conjunto com
          order_item_id, define o grão do modelo.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: order_item_id
        description: >
          Número sequencial do item dentro do pedido. Não é único isoladamente,
          mas deve ser único dentro de cada order_id.
        data_tests:
          - not_null

      - name: product_id
        description: >
          Identificador do produto associado ao item do pedido.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_products__translated')
                field: product_id

      - name: seller_id
        description: >
          Identificador do vendedor responsável pelo item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_sellers__enriched')
                field: seller_id

      - name: price
        description: >
          Preço do produto referente ao item, sem incluir o valor do frete.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

      - name: freight_value
        description: >
          Valor do frete atribuído individualmente ao item do pedido.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: shipping_limit_timestamp
        description: >
          Data e horário limite para o vendedor realizar o envio do item.
        data_tests:
          - not_null

      - name: order_item_total_value
        description: >
          Valor total do item, calculado pela soma do preço do produto com
          o valor do frete.
        data_tests:
          - not_null

      - name: product_category_name
        description: >
          Nome normalizado da categoria do produto. Pode permanecer nulo quando
          a categoria não está disponível nos dados de origem.

      - name: product_name_length
        description: >
          Quantidade de caracteres do nome original do produto.

      - name: product_description_length
        description: >
          Quantidade de caracteres da descrição original do produto.

      - name: product_photos_qty
        description: >
          Quantidade de fotografias cadastradas para o produto.

      - name: product_weight_g
        description: >
          Peso do produto em gramas.

      - name: product_length_cm
        description: >
          Comprimento do produto em centímetros.

      - name: product_height_cm
        description: >
          Altura do produto em centímetros.

      - name: product_width_cm
        description: >
          Largura do produto em centímetros.

      - name: seller_zip_code_prefix
        description: >
          Prefixo de cinco dígitos do CEP do vendedor.

      - name: seller_city_normalized
        description: >
          Cidade do vendedor em formato normalizado, com letras minúsculas,
          remoção de acentos e espaços padronizados.

      - name: seller_state
        description: >
          Sigla da unidade federativa em que o vendedor está localizado.

  - name: int_orders__enriched
    description: >
      Modelo intermediário enriquecido no grão de pedido, com uma linha por
      order_id. Preserva todos os pedidos provenientes de stg_orders e adiciona
      informações do cliente, métricas agregadas dos itens, métricas de pagamento
      e a avaliação deduplicada do pedido por meio de left joins.

    columns:
      - name: order_id
        description: >
          Identificador único do pedido e chave que define o grão do modelo.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: customer_id
        description: >
          Identificador do registro do cliente associado ao pedido. Na base da
          Olist, cada pedido possui um customer_id próprio.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_customers__enriched')
                field: customer_id

      - name: order_status
        description: >
          Situação registrada para o pedido no momento da extração dos dados.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - approved
                  - canceled
                  - created
                  - delivered
                  - invoiced
                  - processing
                  - shipped
                  - unavailable

      - name: order_purchase_timestamp
        description: >
          Data e horário em que o cliente realizou o pedido.
        data_tests:
          - not_null

      - name: order_approved_at
        description: >
          Data e horário em que o pagamento do pedido foi aprovado. Pode permanecer
          nulo em pedidos ainda não aprovados, cancelados ou indisponíveis.

      - name: order_delivered_carrier_timestamp
        description: >
          Data e horário em que o pedido foi entregue à transportadora. Pode
          permanecer nulo quando o pedido não alcançou essa etapa.

      - name: order_delivered_customer_timestamp
        description: >
          Data e horário em que o pedido foi entregue ao cliente. Permanece nulo
          para pedidos não entregues.

      - name: order_estimated_delivery_date
        description: >
          Data estimada de entrega informada ao cliente no momento da compra.

      - name: customer_unique_id
        description: >
          Identificador persistente do cliente, permitindo reconhecer compras
          realizadas pela mesma pessoa em pedidos diferentes.
        data_tests:
          - not_null

      - name: customer_zip_code_prefix
        description: >
          Prefixo de cinco dígitos do CEP informado pelo cliente.

      - name: customer_city
        description: >
          Cidade normalizada do cliente associada ao pedido.

      - name: customer_state
        description: >
          Sigla da unidade federativa do cliente.

      - name: geolocation_lat
        description: >
          Latitude representativa do prefixo de CEP do cliente.

      - name: geolocation_lng
        description: >
          Longitude representativa do prefixo de CEP do cliente.

      - name: order_item_count
        description: >
          Quantidade total de itens registrados no pedido. Permanece nula quando
          o pedido não possui registros na tabela de itens.

      - name: distinct_product_count
        description: >
          Quantidade de produtos distintos presentes no pedido.

      - name: distinct_seller_count
        description: >
          Quantidade de vendedores distintos envolvidos no pedido.

      - name: total_product_value
        description: >
          Soma dos preços dos produtos presentes no pedido, sem incluir o frete.

      - name: total_freight_value
        description: >
          Soma dos valores de frete atribuídos aos itens do pedido.

      - name: total_order_item_value
        description: >
          Valor total calculado a partir da soma dos preços dos produtos e dos
          valores de frete do pedido.

      - name: payment_count
        description: >
          Quantidade de registros ou parcelas de pagamento associados ao pedido.
          Permanece nula quando não existe pagamento registrado.

      - name: distinct_payment_type_count
        description: >
          Quantidade de formas de pagamento distintas utilizadas no pedido.

      - name: primary_payment_type
        description: >
          Principal forma de pagamento utilizada no pedido, determinada pelo
          modelo agregado de pagamentos.

      - name: total_payment_value
        description: >
          Valor total pago pelo cliente, considerando todos os registros de
          pagamento associados ao pedido.

      - name: max_installments
        description: >
          Maior quantidade de parcelas encontrada entre os pagamentos do pedido.

      - name: review_id
        description: >
          Identificador da avaliação preservada para o pedido após a deduplicação.
          Permanece nulo quando o pedido não possui avaliação.

      - name: review_score
        description: >
          Nota atribuída pelo cliente ao pedido, variando de 1 a 5. Permanece nula
          quando não existe avaliação.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

      - name: review_comment_title
        description: >
          Título opcional informado pelo cliente na avaliação do pedido.

      - name: review_comment_message
        description: >
          Comentário opcional informado pelo cliente na avaliação do pedido.

      - name: review_creation_date
        description: >
          Data em que a solicitação de avaliação do pedido foi criada.

      - name: review_answer_timestamp
        description: >
          Data e horário em que a avaliação preservada foi respondida pelo cliente.
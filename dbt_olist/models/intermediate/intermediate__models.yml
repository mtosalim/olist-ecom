version: 2

models:
  - name: int_geolocation__aggregated
    description: >
      Consolida os dados de geolocalização da Olist no grão de uma linha
      por prefixo de CEP. Para cada prefixo, seleciona a combinação de
      cidade e estado mais frequente e calcula a mediana das coordenadas
      de latitude e longitude.

    columns:
      - name: geolocation_zip_code_prefix
        description: >
          Prefixo de CEP que identifica unicamente cada registro do modelo.
        data_tests:
          - not_null
          - unique

      - name: geolocation_city
        description: >
          Cidade pertencente à combinação de cidade e estado mais frequente
          encontrada para o prefixo de CEP.
        data_tests:
          - not_null

      - name: geolocation_state
        description: >
          Unidade federativa pertencente à combinação de cidade e estado
          mais frequente encontrada para o prefixo de CEP.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - AC
                  - AL
                  - AP
                  - AM
                  - BA
                  - CE
                  - DF
                  - ES
                  - GO
                  - MA
                  - MT
                  - MS
                  - MG
                  - PA
                  - PB
                  - PR
                  - PE
                  - PI
                  - RJ
                  - RN
                  - RS
                  - RO
                  - RR
                  - SC
                  - SP
                  - SE
                  - TO

      - name: geolocation_lat
        description: >
          Mediana das latitudes disponíveis para o prefixo de CEP.
        data_tests:
          - not_null

      - name: geolocation_lng
        description: >
          Mediana das longitudes disponíveis para o prefixo de CEP.
        data_tests:
          - not_null

      - name: city_state_frequency
        description: >
          Quantidade de registros da staging que apresentam a combinação
          vencedora de cidade e estado para o prefixo de CEP.
        data_tests:
          - not_null
  
  - name: int_order_items__aggregated
    description: >
      Agrega os itens de pedido no grão de uma linha por pedido, consolidando
      quantidades de itens, produtos e vendedores, além dos valores de produtos,
      frete e valor total.

    columns:
      - name: order_id
        description: Identificador único do pedido.
        data_tests:
          - not_null
          - unique

      - name: order_item_count
        description: Quantidade de itens registrados no pedido.
        data_tests:
          - not_null

      - name: distinct_product_count
        description: Quantidade de produtos distintos presentes no pedido.
        data_tests:
          - not_null

      - name: distinct_seller_count
        description: Quantidade de vendedores distintos presentes no pedido.
        data_tests:
          - not_null

      - name: total_product_value
        description: Soma dos preços de todos os itens do pedido.
        data_tests:
          - not_null

      - name: total_freight_value
        description: Soma dos valores de frete de todos os itens do pedido.
        data_tests:
          - not_null

      - name: total_order_item_value
        description: Soma do valor dos produtos e do frete do pedido.
        data_tests:
          - not_null

  - name: int_order_payments__aggregated
    description: >
      Agrega os registros de pagamento no grão de uma linha por pedido.
      Consolida a quantidade de registros e tipos de pagamento, o valor total
      pago, o maior número válido de parcelas e o tipo responsável pelo maior
      valor pago no pedido.

    columns:
      - name: order_id
        description: Identificador único do pedido.
        data_tests:
          - not_null
          - unique

      - name: payment_count
        description: Quantidade de registros de pagamento associados ao pedido.
        data_tests:
          - not_null

      - name: distinct_payment_type_count
        description: Quantidade de tipos distintos de pagamento utilizados no pedido.
        data_tests:
          - not_null

      - name: primary_payment_type
        description: Tipo de pagamento responsável pelo maior valor pago no pedido.
        data_tests:
          - not_null

      - name: total_payment_value
        description: Valor total pago considerando todos os registros de pagamento do pedido.
        data_tests:
          - not_null

      - name: max_installments
        description: >
          Maior número válido de parcelas identificado no pedido. Pode ser nulo
          quando todos os registros possuem uma quantidade de parcelas inválida.
  
  - name: int_customers__enriched
    description: >
      Enriquece os dados dos clientes com coordenadas geográficas obtidas
      pelo prefixo de CEP. Mantém o grão de uma linha por customer_id e
      preserva clientes sem correspondência na base de geolocalização.

    columns:
      - name: customer_id
        description: >
          Identificador único do cliente associado a um pedido.
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: >
          Identificador que representa o mesmo cliente ao longo de diferentes
          pedidos. Pode aparecer em mais de uma linha.
        data_tests:
          - not_null

      - name: customer_zip_code_prefix
        description: Prefixo do CEP informado pelo cliente.
        data_tests:
          - not_null

      - name: customer_city
        description: Cidade informada no cadastro do cliente.
        data_tests:
          - not_null

      - name: customer_state
        description: Unidade federativa informada no cadastro do cliente.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - AC
                  - AL
                  - AP
                  - AM
                  - BA
                  - CE
                  - DF
                  - ES
                  - GO
                  - MA
                  - MT
                  - MS
                  - MG
                  - PA
                  - PB
                  - PR
                  - PE
                  - PI
                  - RJ
                  - RN
                  - RS
                  - RO
                  - RR
                  - SC
                  - SP
                  - SE
                  - TO

      - name: geolocation_lat
        description: >
          Latitude mediana associada ao prefixo de CEP. Pode ser nula quando
          o CEP não possui correspondência na base de geolocalização.

      - name: geolocation_lng
        description: >
          Longitude mediana associada ao prefixo de CEP. Pode ser nula quando
          o CEP não possui correspondência na base de geolocalização.
  
  - name: int_sellers__enriched
    description: >
      Enriquece os dados dos vendedores com coordenadas geográficas obtidas
      pelo prefixo de CEP. Mantém o grão de uma linha por seller_id e preserva
      vendedores sem correspondência na base de geolocalização.

    columns:
      - name: seller_id
        description: Identificador único do vendedor.
        data_tests:
          - not_null
          - unique

      - name: seller_zip_code_prefix
        description: Prefixo do CEP informado pelo vendedor.
        data_tests:
          - not_null

      - name: seller_city_normalized
        description: >
          Cidade do vendedor com normalização de acentos, capitalização
          e espaços aplicada na camada Staging.
        data_tests:
          - not_null

      - name: seller_state
        description: Unidade federativa informada no cadastro do vendedor.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - AC
                  - AL
                  - AP
                  - AM
                  - BA
                  - CE
                  - DF
                  - ES
                  - GO
                  - MA
                  - MT
                  - MS
                  - MG
                  - PA
                  - PB
                  - PR
                  - PE
                  - PI
                  - RJ
                  - RN
                  - RS
                  - RO
                  - RR
                  - SC
                  - SP
                  - SE
                  - TO

      - name: geolocation_lat
        description: >
          Latitude mediana associada ao prefixo de CEP. Pode ser nula quando
          o CEP não possui correspondência na base de geolocalização.

      - name: geolocation_lng
        description: >
          Longitude mediana associada ao prefixo de CEP. Pode ser nula quando
          o CEP não possui correspondência na base de geolocalização.
  
  
  
  
  
  
  
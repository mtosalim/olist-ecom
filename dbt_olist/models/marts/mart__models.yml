version: 2

models:
  - name: dim_products
    description: >
      Dimensão de produtos no grão de uma linha por product_id, contendo
      a categoria original, a categoria traduzida e os atributos descritivos
      e físicos disponíveis para cada produto.

    columns:
      - name: product_id
        description: Identificador único do produto e chave da dimensão.
        data_tests:
          - not_null
          - unique

      - name: product_category_name
        description: >
          Categoria original do produto em português. Produtos sem categoria
          informada são identificados como unknown.
        data_tests:
          - not_null

      - name: product_category_name_english
        description: >
          Categoria do produto traduzida para o inglês. Produtos sem tradução
          ou categoria informada são identificados como unknown.
        data_tests:
          - not_null

      - name: product_name_length
        description: Quantidade de caracteres do nome do produto.

      - name: product_description_length
        description: Quantidade de caracteres da descrição do produto.

      - name: product_photos_qty
        description: Quantidade de fotos cadastradas para o produto.

      - name: product_weight_g
        description: Peso do produto em gramas.

      - name: product_length_cm
        description: Comprimento do produto em centímetros.

      - name: product_height_cm
        description: Altura do produto em centímetros.

      - name: product_width_cm
        description: Largura do produto em centímetros.

  - name: dim_sellers
    description: >
      Dimensão de vendedores no grão de uma linha por seller_id,
      contendo sua localização e as coordenadas geográficas associadas
      ao prefixo do CEP.

    columns:
      - name: seller_id
        description: Identificador único do vendedor e chave da dimensão.
        data_tests:
          - not_null
          - unique

      - name: seller_zip_code_prefix
        description: Prefixo do CEP cadastrado para o vendedor.
        data_tests:
          - not_null

      - name: seller_city_normalized
        description: Nome normalizado da cidade do vendedor.
        data_tests:
          - not_null

      - name: seller_state
        description: Sigla da unidade federativa do vendedor.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - AC
                  - AL
                  - AP
                  - AM
                  - BA
                  - CE
                  - DF
                  - ES
                  - GO
                  - MA
                  - MT
                  - MS
                  - MG
                  - PA
                  - PB
                  - PR
                  - PE
                  - PI
                  - RJ
                  - RN
                  - RS
                  - RO
                  - RR
                  - SC
                  - SP
                  - SE
                  - TO

      - name: geolocation_zip_code_prefix
        description: >
          Prefixo do CEP encontrado no modelo agregado de geolocalização
          e utilizado para enriquecer o vendedor.

      - name: geolocation_lat
        description: Latitude representativa do prefixo do CEP do vendedor.

      - name: geolocation_lng
        description: Longitude representativa do prefixo do CEP do vendedor.

  - name: dim_customers
    description: >
      Dimensão de clientes no grão de uma linha por customer_id,
      contendo o identificador único da pessoa e sua localização.

    columns:
      - name: customer_id
        description: >
          Identificador do cliente associado a um pedido e chave da dimensão.
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: >
          Identificador que permite reconhecer o mesmo cliente em pedidos
          diferentes.
        data_tests:
          - not_null

      - name: customer_zip_code_prefix
        description: Prefixo do CEP cadastrado para o cliente.
        data_tests:
          - not_null

      - name: customer_city
        description: Nome normalizado da cidade do cliente.
        data_tests:
          - not_null

      - name: customer_state
        description: Sigla da unidade federativa do cliente.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - AC
                  - AL
                  - AP
                  - AM
                  - BA
                  - CE
                  - DF
                  - ES
                  - GO
                  - MA
                  - MT
                  - MS
                  - MG
                  - PA
                  - PB
                  - PR
                  - PE
                  - PI
                  - RJ
                  - RN
                  - RS
                  - RO
                  - RR
                  - SC
                  - SP
                  - SE
                  - TO

      - name: geolocation_lat
        description: Latitude representativa do prefixo do CEP do cliente.

      - name: geolocation_lng
        description: Longitude representativa do prefixo do CEP do cliente.

  - name: fct_order_items
    description: >
      Tabela fato no grão de uma linha por item dentro de um pedido,
      contendo as chaves do produto e do vendedor, a data limite de envio
      e os valores financeiros relacionados ao item.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id

    columns:
      - name: order_id
        description: Identificador do pedido ao qual o item pertence.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

      - name: order_item_id
        description: Número sequencial do item dentro do pedido.
        data_tests:
          - not_null

      - name: product_id
        description: Identificador do produto e chave para a dimensão de produtos.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: seller_id
        description: Identificador do vendedor e chave para a dimensão de vendedores.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id

      - name: shipping_limit_timestamp
        description: Data e hora limite para o vendedor realizar o envio do item.
        data_tests:
          - not_null

      - name: price
        description: Preço do item sem o valor do frete.
        data_tests:
          - not_null

      - name: freight_value
        description: Valor do frete atribuído ao item.
        data_tests:
          - not_null

      - name: order_item_total_value
        description: Valor total do item, calculado como preço mais frete.
        data_tests:
          - not_null

  - name: fct_orders
    description: >
      Tabela fato no grão de uma linha por pedido, contendo o status e os
      timestamps do ciclo do pedido, métricas agregadas de itens e pagamentos
      e os dados da avaliação deduplicada associada ao pedido.

    columns:
      - name: order_id
        description: Identificador único do pedido e chave da tabela fato.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Identificador do cliente associado ao pedido.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_status
        description: Status atual ou final do pedido.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - created
                  - approved
                  - invoiced
                  - processing
                  - shipped
                  - delivered
                  - unavailable
                  - canceled

      - name: order_purchase_timestamp
        description: Data e hora em que o pedido foi realizado.
        data_tests:
          - not_null

      - name: order_approved_at
        description: Data e hora em que o pagamento do pedido foi aprovado.

      - name: order_delivered_carrier_timestamp
        description: Data e hora em que o pedido foi entregue à transportadora.

      - name: order_delivered_customer_timestamp
        description: Data e hora em que o pedido foi entregue ao cliente.

      - name: order_estimated_delivery_date
        description: Data estimada para entrega do pedido.
        data_tests:
          - not_null

      - name: order_item_count
        description: Quantidade total de itens existentes no pedido.

      - name: distinct_product_count
        description: Quantidade de produtos distintos existentes no pedido.

      - name: distinct_seller_count
        description: Quantidade de vendedores distintos envolvidos no pedido.

      - name: total_product_value
        description: Soma dos preços dos produtos do pedido, sem frete.

      - name: total_freight_value
        description: Soma dos valores de frete dos itens do pedido.

      - name: total_order_item_value
        description: Valor total dos itens do pedido, incluindo o frete.

      - name: payment_count
        description: Quantidade de registros de pagamento associados ao pedido.

      - name: distinct_payment_type_count
        description: Quantidade de formas de pagamento distintas utilizadas no pedido.

      - name: primary_payment_type
        description: Forma de pagamento com maior valor total dentro do pedido.

      - name: total_payment_value
        description: Valor total registrado nos pagamentos do pedido.

      - name: max_installments
        description: Maior quantidade de parcelas registrada no pedido.

      - name: review_id
        description: Identificador da avaliação deduplicada associada ao pedido.

      - name: review_score
        description: Nota da avaliação do pedido, variando entre 1 e 5.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

      - name: review_comment_title
        description: Título opcional do comentário da avaliação.

      - name: review_comment_message
        description: Texto opcional do comentário da avaliação.

      - name: review_creation_date
        description: Data de criação da avaliação.

      - name: review_answer_timestamp
        description: Data e hora da resposta ou envio da avaliação.














        